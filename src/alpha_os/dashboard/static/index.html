<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --cyan: #00f0ff;
      --green: #39ff14;
      --pink: #ff2a6d;
      --bg: #030308;
    }
    body { background: var(--bg); color: #e2e8f0; font-family: system-ui, sans-serif; }
    .panel {
      background: linear-gradient(145deg, rgba(8,12,24,.92), rgba(3,3,8,.96));
      border: 1px solid rgba(0,240,255,.12);
      box-shadow: 0 0 24px rgba(0,240,255,.04);
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(0,240,255,.15); }
    .glow-pink { box-shadow: 0 0 30px rgba(255,42,109,.25); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.5); }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(57,255,20,.4); }
    .section-title { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: #64748b; }
    #orb-canvas { border-radius: 50%; }
    .agent-card { min-width: 140px; }
    .onboarding { backdrop-filter: blur(8px); background: rgba(3,3,8,.85); }
    .metric-pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.7} 50%{opacity:1} }
    .orb-flash { animation: orbFlash 0.6s ease-out; }
    @keyframes orbFlash { 0%{filter:brightness(2) saturate(1.5)} 100%{filter:none} }
    .mic-active { box-shadow: 0 0 20px rgba(255,42,109,.6); border-color: #ff2a6d !important; }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden">
  <canvas id="bg-canvas" class="fixed inset-0 w-full h-full -z-10 opacity-40"></canvas>

  <!-- Onboarding -->
  <div id="onboarding" class="onboarding fixed inset-0 z-50 flex items-center justify-center hidden">
    <div class="panel rounded-3xl p-8 max-w-md w-full mx-4 glow-cyan">
      <h2 class="text-xl font-bold neon-cyan mb-2">Connect to Gateway</h2>
      <p class="text-sm text-slate-400 mb-6">Alpha OS auto-detects Hermes or OpenClaw. Configure if needed.</p>
      <label class="section-title block mb-1">Runtime</label>
      <select id="cfg-runtime" class="w-full mb-3 bg-[#050508] border border-slate-700 rounded-xl px-3 py-2 text-sm">
        <option value="auto">Auto-detect</option>
        <option value="hermes">Hermes</option>
        <option value="openclaw">OpenClaw</option>
      </select>
      <label class="section-title block mb-1">Hermes URL</label>
      <input id="cfg-hermes-url" class="w-full mb-3 bg-[#050508] border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono" placeholder="http://127.0.0.1:8642" />
      <label class="section-title block mb-1">Hermes API Key</label>
      <input id="cfg-hermes-key" type="password" class="w-full mb-3 bg-[#050508] border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono" placeholder="API_SERVER_KEY" />
      <label class="section-title block mb-1">OpenClaw WS URL</label>
      <input id="cfg-oc-url" class="w-full mb-3 bg-[#050508] border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono" placeholder="ws://127.0.0.1:18789" />
      <label class="section-title block mb-1">OpenClaw Token</label>
      <input id="cfg-oc-token" type="password" class="w-full mb-4 bg-[#050508] border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono" />
      <div class="flex gap-2">
        <button onclick="saveConfig()" class="flex-1 bg-cyan-950 border border-cyan-800 text-cyan-300 rounded-xl py-2 text-sm font-semibold hover:bg-cyan-900">Connect</button>
        <button onclick="dismissOnboarding()" class="px-4 border border-slate-700 rounded-xl text-slate-400 text-sm">Skip</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#030308]/90 backdrop-blur px-4 py-3">
    <div class="max-w-[1800px] mx-auto flex flex-wrap items-center gap-3 justify-between">
      <div class="flex items-center gap-3">
        <span class="text-lg font-bold tracking-widest neon-cyan">ALPHA OS</span>
        <span id="online-pill" class="px-3 py-1 rounded-full text-xs font-semibold border border-emerald-800 text-emerald-400 bg-emerald-950/40">ONLINE</span>
        <div id="hermes-badge" class="hidden px-3 py-1 rounded-full text-xs font-semibold border"></div>
        <div id="openclaw-badge" class="hidden px-3 py-1 rounded-full text-xs font-semibold border"></div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="reconnect()" class="text-xs px-3 py-1 rounded-full border border-slate-700 text-slate-400 hover:border-cyan-800 hover:text-cyan-400">Reconnect</button>
        <button onclick="toggleView('full')" id="btn-full" class="text-xs px-2 py-1 rounded border border-slate-700 text-slate-500">Full</button>
        <button onclick="toggleView('minimal')" id="btn-minimal" class="text-xs px-2 py-1 rounded border border-slate-700 text-slate-500">Minimal</button>
        <span id="clock" class="text-xs text-slate-500 font-mono"></span>
      </div>
    </div>
    <!-- Metrics bar -->
    <div id="metrics-bar" class="max-w-[1800px] mx-auto mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="bg-[#050508] rounded-xl px-3 py-2 border border-slate-800 text-center">
        <div class="section-title">Sessions</div>
        <div id="m-sessions" class="text-lg font-semibold neon-cyan font-mono">—</div>
      </div>
      <div class="bg-[#050508] rounded-xl px-3 py-2 border border-slate-800 text-center">
        <div class="section-title">Agents</div>
        <div id="m-agents" class="text-lg font-semibold neon-cyan font-mono">—</div>
      </div>
      <div class="bg-[#050508] rounded-xl px-3 py-2 border border-slate-800 text-center">
        <div class="section-title">Toolsets</div>
        <div id="m-toolsets" class="text-lg font-semibold neon-green font-mono">—</div>
      </div>
      <div class="bg-[#050508] rounded-xl px-3 py-2 border border-slate-800 text-center">
        <div class="section-title">Skills</div>
        <div id="m-skills" class="text-lg font-semibold neon-green font-mono">—</div>
      </div>
    </div>
  </header>

  <main id="main-grid" class="max-w-[1800px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    <!-- Left: agents -->
    <section class="lg:col-span-3 panel rounded-3xl p-5 glow-cyan">
      <div class="section-title mb-3 flex justify-between">
        <span>Agents</span>
        <span id="active-agents-count" class="text-slate-500">0</span>
      </div>
      <div id="agent-orbs" class="flex flex-wrap gap-3 justify-center min-h-[120px]"></div>
    </section>

    <!-- Center -->
    <section class="lg:col-span-6 flex flex-col gap-4">
      <div class="panel rounded-3xl p-6 flex flex-col items-center glow-pink">
        <canvas id="orb-canvas" width="160" height="160" class="mb-3"></canvas>
        <p id="greeting" class="text-sm text-slate-400 text-center max-w-md">Awaiting gateway…</p>
      </div>
      <div class="panel rounded-3xl p-5">
        <div class="section-title mb-2">Telemetry</div>
        <div id="telemetry" class="h-32 overflow-y-auto text-xs text-slate-500 space-y-1 font-mono"></div>
      </div>
      <div class="panel rounded-3xl p-4 flex gap-2 items-center">
        <button id="mic-btn" onclick="toggleMic()" title="Voice command" class="w-12 h-12 rounded-full border border-slate-700 bg-[#050508] flex items-center justify-center text-lg hover:border-pink-800 transition-all">🎙</button>
        <input id="command-input" type="text" placeholder="Command Alpha…" class="flex-1 bg-[#050508] border border-slate-800 rounded-2xl px-4 py-3 text-sm outline-none focus:border-cyan-800" onkeydown="if(event.key==='Enter')sendCommand()" />
        <button onclick="sendCommand()" class="px-5 py-3 rounded-2xl bg-pink-950 border border-pink-800 text-pink-300 text-sm font-semibold">Send</button>
      </div>
      <!-- Ops boards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="ops-boards">
        <div class="panel rounded-2xl p-4">
          <div class="section-title mb-2">Activity</div>
          <div id="board-activity" class="text-xs text-slate-500 space-y-1"><div class="italic text-slate-600">No activity yet</div></div>
        </div>
        <div class="panel rounded-2xl p-4">
          <div class="section-title mb-2">Sessions</div>
          <div id="board-sessions" class="text-xs text-slate-500 space-y-1"><div class="italic text-slate-600">No sessions</div></div>
        </div>
        <div class="panel rounded-2xl p-4">
          <div class="section-title mb-2">Integrations</div>
          <div id="board-integrations" class="text-xs text-slate-500 space-y-1"><div class="italic text-slate-600">Offline</div></div>
        </div>
      </div>
    </section>

    <!-- Right -->
    <section class="lg:col-span-3 flex flex-col gap-4">
      <div class="panel rounded-3xl p-5 glow-cyan" id="tailscale-panel">
        <div class="section-title mb-3 flex justify-between">
          <span>Tailscale</span>
          <span id="ts-status-pill" class="text-[10px] px-2 py-px rounded-full border border-slate-700 text-slate-400">—</span>
        </div>
        <div id="ts-self" class="text-sm font-mono text-slate-300 mb-2">—</div>
        <div id="ts-peers" class="text-xs text-slate-500 space-y-1 max-h-32 overflow-y-auto"></div>
      </div>
      <div class="panel rounded-3xl p-5 glow-cyan" id="integrations-panel">
        <div class="section-title mb-3 flex justify-between">
          <span>Integrations</span>
          <span id="int-status-pill" class="text-[10px] px-2 py-px rounded-full border border-slate-700 text-slate-400">OFFLINE</span>
        </div>
        <div id="int-toolsets" class="text-xs text-slate-400 space-y-1 mb-3"></div>
        <div id="int-skills" class="text-xs text-slate-500 space-y-1"></div>
      </div>
      <div id="mcp-strip" class="panel rounded-2xl px-4 py-2 text-[10px] text-slate-500 text-center hidden">
        MCP: <span id="mcp-strip-text">—</span>
      </div>
    </section>
  </main>

<script>
let currentState = {};
let ws = null;
let mcpLogged = false;
let lastEventSeq = 0;
let micActive = false;
let recognition = null;

function tick() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
setInterval(tick, 1000); tick();

function addLog(msg, who = "system") {
  const el = document.getElementById("telemetry");
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${who}: ${msg}`;
  el.prepend(line);
  while (el.children.length > 80) el.removeChild(el.lastChild);
}

function renderBadges(data) {
  const hb = document.getElementById("hermes-badge");
  const ob = document.getElementById("openclaw-badge");
  if (data.hermes?.connected) {
    hb.textContent = "⬡ HERMES LIVE";
    hb.className = "px-3 py-1 rounded-full text-xs font-semibold border border-emerald-800 text-emerald-400 bg-emerald-950/40";
    hb.classList.remove("hidden");
  } else if (data.hermes) {
    hb.textContent = "⬡ HERMES OFFLINE";
    hb.className = "px-3 py-1 rounded-full text-xs font-semibold border border-amber-800 text-amber-400 bg-amber-950/30";
    hb.classList.remove("hidden");
  }
  if (data.openclaw?.connected) {
    ob.textContent = "⬡ OPENCLAW LIVE";
    ob.className = "px-3 py-1 rounded-full text-xs font-semibold border border-emerald-800 text-emerald-400 bg-emerald-950/40";
    ob.classList.remove("hidden");
  } else if (data.openclaw) {
    ob.textContent = "⬡ OPENCLAW OFFLINE";
    ob.className = "px-3 py-1 rounded-full text-xs font-semibold border border-amber-800 text-amber-400 bg-amber-950/30";
    ob.classList.remove("hidden");
  }
}

function renderAgents(state) {
  const wrap = document.getElementById("agent-orbs");
  const agents = state.agents || [];
  document.getElementById("active-agents-count").textContent = agents.length;
  if (!agents.length) {
    wrap.innerHTML = '<div class="text-slate-600 text-xs italic">No agents discovered</div>';
    return;
  }
  wrap.innerHTML = agents.map(a => `
    <div class="agent-card panel rounded-2xl p-3 text-center border border-slate-800" style="border-color:${a.color}33">
      <div class="w-10 h-10 rounded-full mx-auto mb-2 metric-pulse" style="background:${a.color}22; box-shadow:0 0 12px ${a.color}55"></div>
      <div class="text-sm font-semibold" style="color:${a.color}">${a.name}</div>
      <div class="text-[10px] text-slate-500 truncate">${a.title || ""}</div>
      <div class="text-[10px] mt-1 ${a.status === "ACTIVE" ? "text-emerald-400" : "text-slate-500"}">${a.status || "Ready"}</div>
    </div>
  `).join("");
}

function renderMetrics(data) {
  const m = data.metrics || {};
  const set = (id, v) => document.getElementById(id).textContent = v ?? "—";
  set("m-sessions", m.sessions);
  set("m-agents", m.agents);
  set("m-toolsets", m.toolsets);
  set("m-skills", m.skills);
}

function renderTailscale(ts) {
  if (!ts) return;
  const pill = document.getElementById("ts-status-pill");
  if (ts.available && ts.backend_state === "Running") {
    pill.textContent = "LIVE";
    pill.className = "text-[10px] px-2 py-px rounded-full border border-emerald-800 text-emerald-400";
  } else {
    pill.textContent = ts.available ? ts.backend_state : "N/A";
    pill.className = "text-[10px] px-2 py-px rounded-full border border-amber-800 text-amber-400";
  }
  document.getElementById("ts-self").textContent = ts.self_ip ? `${ts.hostname || ""} ${ts.self_ip}` : "—";
  const peers = document.getElementById("ts-peers");
  if (ts.peers?.length) {
    peers.innerHTML = ts.peers.slice(0, 8).map(p =>
      `<div class="flex justify-between"><span>${p.hostname}</span><span class="${p.online ? "text-emerald-400" : "text-slate-600"}">${p.online ? "●" : "○"}</span></div>`
    ).join("");
  } else {
    peers.innerHTML = '<div class="italic text-slate-600">No peers</div>';
  }
}

function renderIntegrations(int) {
  if (!int) return;
  const pill = document.getElementById("int-status-pill");
  if (int.connected) {
    pill.textContent = "LIVE";
    pill.className = "text-[10px] px-2 py-px rounded-full border border-emerald-800 text-emerald-400";
  } else {
    pill.textContent = "OFFLINE";
    pill.className = "text-[10px] px-2 py-px rounded-full border border-amber-800 text-amber-400";
  }
  const ts = int.toolsets || [];
  const sk = int.skills || [];
  document.getElementById("int-toolsets").innerHTML = ts.length
    ? ts.slice(0, 6).map(t => `<div class="flex justify-between px-2 py-1 rounded-lg bg-[#050508] border border-slate-800"><span>${t.name || t.label}</span><span class="neon-cyan">${(t.tools||[]).length || t.tool_count || ""}</span></div>`).join("")
    : '<div class="italic text-slate-600">No toolsets</div>';
  document.getElementById("int-skills").innerHTML = sk.length
    ? sk.slice(0, 5).map(s => `<div class="truncate">${s.name}</div>`).join("")
    : "";
  const strip = document.getElementById("mcp-strip");
  if (int.connected && (ts.length || sk.length)) {
    strip.classList.remove("hidden");
    document.getElementById("mcp-strip-text").textContent = `${ts.length} toolsets · ${sk.length} skills`;
    if (!mcpLogged) { mcpLogged = true; addLog(`Integrations: ${ts.length} toolsets, ${sk.length} skills`, "alpha"); }
  }
}

function renderBoards(data) {
  const int = data.integrations || {};
  const sess = int.sessions || [];
  document.getElementById("board-sessions").innerHTML = sess.length
    ? sess.slice(0, 5).map(s => `<div class="truncate">${s.id || s.title || s.model || "session"}</div>`).join("")
    : '<div class="italic text-slate-600">No sessions</div>';
  const ts = int.toolsets || [];
  document.getElementById("board-integrations").innerHTML = ts.length
    ? ts.slice(0, 5).map(t => `<div>${t.name || t.label}</div>`).join("")
    : '<div class="italic text-slate-600">Offline</div>';
  const recent = data.memory?.recent || [];
  document.getElementById("board-activity").innerHTML = recent.length
    ? recent.map(r => `<div><span class="text-cyan-600">${r.who}</span> ${r.text?.slice(0,60)}</div>`).join("")
    : '<div class="italic text-slate-600">No activity yet</div>';
}

function renderLiveEvents(data) {
  const events = data.live_events || [];
  for (const ev of events) {
    if (ev.seq <= lastEventSeq) continue;
    lastEventSeq = ev.seq;
    addLog(ev.summary, ev.source);
  }
  if (data.orb_pulse) {
    const orb = document.getElementById("orb-canvas");
    orb.classList.remove("orb-flash");
    void orb.offsetWidth;
    orb.classList.add("orb-flash");
  }
}

function applyState(data) {
  currentState = data;
  renderBadges(data);
  renderAgents(data);
  renderMetrics(data);
  renderTailscale(data.tailscale);
  renderIntegrations(data.integrations);
  renderBoards(data);
  renderLiveEvents(data);
  if (data.greeting) document.getElementById("greeting").textContent = data.greeting;
  const offline = !data.hermes_connected && !data.openclaw_connected;
  if (offline && !sessionStorage.getItem("onboarding-dismissed")) {
    document.getElementById("onboarding").classList.remove("hidden");
  }
}

async function refreshState() {
  try {
    const r = await fetch("/api/state");
    if (r.ok) applyState(await r.json());
  } catch (e) { addLog("Poll failed: " + e.message); }
}

function connectWs() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/state`);
  ws.onmessage = (e) => { try { applyState(JSON.parse(e.data)); } catch(_){} };
  ws.onclose = () => { setTimeout(connectWs, 3000); };
}

async function sendCommand() {
  const input = document.getElementById("command-input");
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = "";
  addLog(cmd, "you");
  try {
    const r = await fetch("/api/command", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({command: cmd}) });
    const d = await r.json();
    if (d.reply) { addLog(d.reply, "alpha"); }
  } catch (e) { addLog("Command failed", "system"); }
}

async function saveConfig() {
  const body = {
    runtime: document.getElementById("cfg-runtime").value,
    hermes_gateway_url: document.getElementById("cfg-hermes-url").value || undefined,
    hermes_api_key: document.getElementById("cfg-hermes-key").value || undefined,
    openclaw_ws_url: document.getElementById("cfg-oc-url").value || undefined,
    openclaw_token: document.getElementById("cfg-oc-token").value || undefined,
  };
  await fetch("/api/config", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  dismissOnboarding();
  addLog("Config saved — reconnecting…", "alpha");
  refreshState();
}

function dismissOnboarding() {
  sessionStorage.setItem("onboarding-dismissed", "1");
  document.getElementById("onboarding").classList.add("hidden");
}

function reconnect() {
  addLog("Reconnect requested", "alpha");
  refreshState();
}

function toggleView(mode) {
  document.getElementById("ops-boards").style.display = mode === "minimal" ? "none" : "grid";
  document.getElementById("metrics-bar").style.display = mode === "minimal" ? "none" : "grid";
}

function toggleMic() {
  const btn = document.getElementById("mic-btn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addLog("Browser speech recognition not supported — type commands instead", "system");
    return;
  }
  if (micActive && recognition) {
    recognition.stop();
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-GB";
  recognition.onstart = () => {
    micActive = true;
    btn.classList.add("mic-active");
    addLog("Listening…", "voice");
  };
  recognition.onend = () => {
    micActive = false;
    btn.classList.remove("mic-active");
  };
  recognition.onerror = (e) => {
    micActive = false;
    btn.classList.remove("mic-active");
    if (e.error !== "aborted") addLog("Mic: " + e.error, "system");
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) {
      document.getElementById("command-input").value = text;
      sendCommand();
    }
  };
  recognition.start();
}

// Orb animation
(function orb() {
  const c = document.getElementById("orb-canvas");
  const ctx = c.getContext("2d");
  let t = 0;
  function draw() {
    t += 0.02;
    const w = c.width, h = c.height, cx = w/2, cy = h/2, r = 55 + Math.sin(t)*4;
    ctx.clearRect(0,0,w,h);
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r+20);
    g.addColorStop(0, "rgba(255,42,109,0.9)");
    g.addColorStop(0.5, "rgba(255,42,109,0.35)");
    g.addColorStop(1, "rgba(255,42,109,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,r+15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff2a6d";
    ctx.shadowColor = "#ff2a6d"; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }
  draw();
})();

// BG particles
(function bg() {
  const c = document.getElementById("bg-canvas");
  const ctx = c.getContext("2d");
  function resize() { c.width = innerWidth; c.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  const pts = Array.from({length: 40}, () => ({ x: Math.random(), y: Math.random(), s: Math.random()*2 }));
  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(p => {
      ctx.fillStyle = "rgba(0,240,255,0.15)";
      ctx.fillRect(p.x*c.width, p.y*c.height, p.s, p.s);
      p.y -= 0.0003; if (p.y < 0) p.y = 1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

connectWs();
refreshState();
setInterval(refreshState, 10000);
</script>
</body>
</html>
